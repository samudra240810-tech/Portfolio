<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samudra Kashyap</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111111;
    --border: #1e1e1e;
    --text: #f0f0f0;
    --muted: #888;
    --ig1: #f58529;
    --ig2: #dd2a7b;
    --ig3: #8134af;
    --grad: linear-gradient(135deg, var(--ig1), var(--ig2), var(--ig3));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(ellipse at 20% 20%, rgba(245,133,41,0.07) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(129,52,175,0.07) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .welcome-tag {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    margin-bottom: 28px;
  }
  .avatar-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    border-radius: 50%;
    padding: 3px;
    background: var(--grad);
    animation: fadeUp 0.8s 0.1s ease both;
  }
  .avatar-inner {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    background: linear-gradient(135deg, #1a1a1a, #111);
    letter-spacing: 1px;
  }
  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 10vw, 64px);
    letter-spacing: 3px;
    line-height: 1;
    background: var(--grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.8s 0.2s ease both;
  }
  .bio {
    margin-top: 10px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.5px;
    animation: fadeUp 0.8s 0.3s ease both;
  }
  .header { text-align: center; animation: fadeUp 0.8s ease both; }
  .divider {
    width: 40px;
    height: 1px;
    background: var(--grad);
    animation: fadeUp 0.8s 0.4s ease both;
  }
  .qr-card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeUp 0.8s 0.5s ease both;
    position: relative;
    overflow: hidden;
  }
  .qr-card::before {
    content: '';
    position: absolute;
    top: -60px; left: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(245,133,41,0.12), transparent 70%);
    pointer-events: none;
  }
  .qr-card::after {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(129,52,175,0.12), transparent 70%);
    pointer-events: none;
  }
  .qr-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .qr-image-wrap {
    width: 220px;
    height: 220px;
    border-radius: 16px;
    padding: 3px;
    background: var(--grad);
    box-shadow: 0 0 40px rgba(221,42,123,0.25);
  }
  .qr-image-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 13px;
    object-fit: cover;
    display: block;
  }
  .handle {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    background: var(--grad);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .follow-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    padding: 14px 32px;
    border-radius: 50px;
    background: var(--grad);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.5px;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.8s 0.6s ease both;
    box-shadow: 0 4px 24px rgba(221,42,123,0.25);
  }
  .follow-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(221,42,123,0.4);
  }
  .footer {
    color: #333;
    font-size: 12px;
    letter-spacing: 1px;
    animation: fadeUp 0.8s 0.7s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
